<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Người Tôi Thương</title>
    <style>
        body { text-align: center; background: #ffe6e6; font-family: sans-serif; padding-top: 100px; }
        h1 { color: #ff4d4d; }
        .heart { font-size: 100px; color: red; animation: beat .25s infinite alternate; }
        @keyframes beat { to { transform: scale(1.1); } }
    </style>
</head>
<body>
    <div class="heart">❤️</div>
    <h1>Anh xin lỗi em mà oah!</h1>
    <p>Trang web này dành riêng cho em đó!</p>
</body>
</html>
